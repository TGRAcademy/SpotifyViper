name: SpotifyViper

options:
  bundleIdPrefix: com.academy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Moya:
    url: https://github.com/Moya/Moya
    from: "15.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.10.0"
  netfox:
    url: https://github.com/kasketis/netfox
    from: "1.21.0"

targets:
  SpotifyViper:
    type: application
    platform: iOS
    sources:
      - path: SpotifyViper
    dependencies:
      - package: Moya
        product: Moya
      - package: Kingfisher
        product: Kingfisher
      - package: netfox
        product: netfox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.academy.SpotifyViper
        INFOPLIST_FILE: SpotifyViper/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  SpotifyViper:
    build:
      targets:
        SpotifyViper: all
    run:
      config: Debug
